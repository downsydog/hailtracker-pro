services:
  hailtracker:
    build: .
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SKIP_HEAVY_ML=${SKIP_HEAVY_ML:-true}
      - DEV_MODE=${DEV_MODE:-false}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENABLE_MRMS=${ENABLE_MRMS:-true}
      - MRMS_REFRESH_SECONDS=${MRMS_REFRESH_SECONDS:-120}
      - MRMS_PROVIDER=${MRMS_PROVIDER:-aws}
      - DATABASE_URL=postgresql://hailtracker:${POSTGRES_PASSWORD:-hailtracker_dev}@postgres:5432/hailtracker
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - RATE_LIMIT_DEFAULT=${RATE_LIMIT_DEFAULT:-60/minute}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - STORM_MAX_WORKERS=${STORM_MAX_WORKERS:-6}
      - STORM_DISCOVERY_BATCH=${STORM_DISCOVERY_BATCH:-20}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hailtracker
      POSTGRES_USER: hailtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hailtracker_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hailtracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-radar:
    build: .
    restart: unless-stopped
    command: ["bash", "-c", "eval \"$(micromamba shell hook --shell bash)\" && micromamba activate hail && exec celery -A backend.app.celery_app:celery_app worker -Q radar -c 1 --loglevel=info"]
    env_file:
      - .env
    environment:
      - SKIP_HEAVY_ML=${SKIP_HEAVY_ML:-true}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENABLE_MRMS=${ENABLE_MRMS:-true}
      - MRMS_PROVIDER=${MRMS_PROVIDER:-aws}
      - DATABASE_URL=postgresql://hailtracker:${POSTGRES_PASSWORD:-hailtracker_dev}@postgres:5432/hailtracker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORM_MAX_WORKERS=${STORM_MAX_WORKERS:-6}
      - STORM_DISCOVERY_BATCH=${STORM_DISCOVERY_BATCH:-20}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-backfill:
    build: .
    restart: unless-stopped
    profiles:
      - workers
      - production
    command: ["bash", "-c", "eval \"$(micromamba shell hook --shell bash)\" && micromamba activate hail && exec celery -A backend.app.celery_app:celery_app worker -Q radar_backfill -c 1 --loglevel=info"]
    env_file:
      - .env
    environment:
      - SKIP_HEAVY_ML=${SKIP_HEAVY_ML:-true}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ENABLE_MRMS=${ENABLE_MRMS:-true}
      - MRMS_PROVIDER=${MRMS_PROVIDER:-aws}
      - DATABASE_URL=postgresql://hailtracker:${POSTGRES_PASSWORD:-hailtracker_dev}@postgres:5432/hailtracker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - STORM_MAX_WORKERS=${STORM_MAX_WORKERS:-6}
      - STORM_DISCOVERY_BATCH=${STORM_DISCOVERY_BATCH:-20}
      - BACKFILL_MAX_RUNTIME=${BACKFILL_MAX_RUNTIME:-3600}
      - BACKFILL_MAX_WINDOWS=${BACKFILL_MAX_WINDOWS:-1800}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-ops:
    build: .
    restart: unless-stopped
    profiles:
      - workers
      - production
    command: ["bash", "-c", "eval \"$(micromamba shell hook --shell bash)\" && micromamba activate hail && exec celery -A backend.app.celery_app:celery_app worker -Q radar_ops -c 1 --loglevel=info"]
    env_file:
      - .env
    environment:
      - SKIP_HEAVY_ML=${SKIP_HEAVY_ML:-true}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql://hailtracker:${POSTGRES_PASSWORD:-hailtracker_dev}@postgres:5432/hailtracker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - WATCHDOG_WEBHOOK_URL=${WATCHDOG_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: ["bash", "-c", "eval \"$(micromamba shell hook --shell bash)\" && micromamba activate hail && exec celery -A backend.app.celery_app:celery_app beat --loglevel=info"]
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_URL=postgresql://hailtracker:${POSTGRES_PASSWORD:-hailtracker_dev}@postgres:5432/hailtracker
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
