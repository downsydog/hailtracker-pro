version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hailtracker_postgres
    environment:
      POSTGRES_USER: hailtracker
      POSTGRES_PASSWORD: hailtracker_dev_2024
      POSTGRES_DB: hailtracker_master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hailtracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  flower:
    image: mher/flower
    container_name: hailtracker_flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
